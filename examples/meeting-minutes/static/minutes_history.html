<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Biên bản - Meeting Minutes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 100%); color: #fff; padding: 30px; text-align: center; position: relative; }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: .9; font-size: 15px; }
        .back-button { position: absolute; top: 30px; left: 30px; background: rgba(255,255,255,.2); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .back-button:hover { background: rgba(255,255,255,.3); }
        .content { padding: 30px; }
        .history-list { display: grid; gap: 15px; }
        .history-item { padding: 20px; border-radius: 10px; background: #f8f9fa; border-left: 4px solid #4338ca; cursor: pointer; transition: all .3s; }
        .history-item:hover { background: #eef2ff; transform: translateX(5px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .history-item-header { display: flex; justify-content: space-between; align-items: center; }
        .history-item-title { font-size: 18px; font-weight: 600; color: #212529; }
        .history-item-meta { font-size: 13px; color: #6c757d; margin-top: 4px; }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-badge.has-transcript { background: #d4edda; color: #155724; }
        .status-badge.no-transcript { background: #fff3cd; color: #856404; }
        .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .empty-state-icon { font-size: 64px; margin-bottom: 20px; }
        .empty-state-text { font-size: 18px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); overflow-y: auto; }
        .modal-content { background: #fff; margin: 40px auto; padding: 30px; border-radius: 20px; max-width: 880px; box-shadow: 0 20px 60px rgba(0,0,0,.3); position: relative; }
        .close { position: absolute; right: 20px; top: 16px; font-size: 28px; font-weight: bold; color: #aaa; cursor: pointer; }
        .close:hover { color: #000; }
        .modal-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #e9ecef; }
        .modal-header h2 { font-size: 22px; color: #212529; margin-bottom: 6px; }
        .recording-info { font-size: 13px; color: #6c757d; }
        .audio-player { margin: 16px 0; padding: 12px; background: #f8f9fa; border-radius: 8px; }
        .audio-player audio { width: 100%; }
        .section { margin-bottom: 26px; }
        .section h3 { font-size: 17px; margin-bottom: 12px; color: #212529; }
        .summary-box { white-space: pre-wrap; line-height: 1.6; font-size: 14px; background: #eef2ff; border-left: 4px solid #4338ca; padding: 16px; border-radius: 8px; color: #1e293b; }
        .summary-box.empty { color: #6c757d; font-style: italic; background: #f8f9fa; border-left-color: #cbd5e1; }
        .line { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; background: #f8f9fa; margin-bottom: 6px; }
        .who { font-weight: 700; flex-shrink: 0; min-width: 84px; }
        .line .txt { flex: 1; line-height: 1.5; color: #212529; }
        .line .ts { font-size: 11px; color: #adb5bd; flex-shrink: 0; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4338ca; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/minutes" class="back-button">← Quay lại</a>
            <h1>📋 Lịch sử Biên bản cuộc họp</h1>
            <p>Xem lại transcript theo người nói và biên bản AI</p>
        </div>
        <div class="content">
            <div id="historyList" class="history-list">
                <div class="loading"><div class="loading-spinner"></div><div>Đang tải...</div></div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeDetail()">&times;</span>
            <div class="modal-header">
                <h2 id="detailTitle">Chi tiết cuộc họp</h2>
                <div class="recording-info" id="detailInfo"></div>
            </div>
            <div id="detailContent">
                <div class="loading"><div class="loading-spinner"></div><div>Đang tải...</div></div>
            </div>
        </div>
    </div>

    <script>
        const SPEAKER_COLORS = ['#2563eb', '#059669', '#db2777', '#d97706', '#7c3aed', '#ea580c', '#0891b2', '#dc2626'];
        const speakerColorMap = {};
        function speakerDisplay(s) {
            if (s && /^S\d+$/i.test(s)) return 'Người ' + s.slice(1);
            return s || 'Không rõ';
        }
        function speakerColor(s) {
            if (!(s in speakerColorMap)) speakerColorMap[s] = SPEAKER_COLORS[Object.keys(speakerColorMap).length % SPEAKER_COLORS.length];
            return speakerColorMap[s];
        }

        window.addEventListener('DOMContentLoaded', loadHistory);

        async function loadHistory() {
            const list = document.getElementById('historyList');
            try {
                const resp = await fetch('/api/minutes/history');
                const recordings = await resp.json(); // API trả về MẢNG trực tiếp
                if (Array.isArray(recordings) && recordings.length > 0) {
                    list.innerHTML = recordings.map(rec => `
                        <div class="history-item" onclick="viewRecording('${rec.id}')">
                            <div class="history-item-header">
                                <div>
                                    <div class="history-item-title">🗣️ Cuộc họp - ${formatDate(rec.date)} ${formatTime(rec.time)}</div>
                                    <div class="history-item-meta">${rec.filename}</div>
                                </div>
                                <span class="status-badge ${rec.has_transcript ? 'has-transcript' : 'no-transcript'}">
                                    ${rec.has_transcript ? '✅ Có biên bản' : '⚠️ Chỉ có audio'}
                                </span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Chưa có cuộc họp nào</div></div>`;
                }
            } catch (e) {
                list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">Lỗi khi tải lịch sử: ${e.message}</div></div>`;
            }
        }

        async function viewRecording(recordingId) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailContent');
            const title = document.getElementById('detailTitle');
            const info = document.getElementById('detailInfo');
            modal.style.display = 'block';
            content.innerHTML = `<div class="loading"><div class="loading-spinner"></div><div>Đang tải...</div></div>`;

            try {
                const resp = await fetch(`/api/minutes/history/${recordingId}`);
                if (!resp.ok) throw new Error('Không tìm thấy bản ghi');
                const data = await resp.json();
                const parts = recordingId.split('_');
                title.textContent = `Cuộc họp - ${formatDate(parts[2] || '')} ${formatTime(parts[3] || '')}`;
                info.textContent = `File: ${data.filename}`;

                let html = '';
                if (data.wav_url) {
                    html += `<div class="audio-player"><audio controls><source src="${data.wav_url}" type="audio/wav">Trình duyệt không hỗ trợ audio.</audio></div>`;
                }

                // Biên bản AI
                const dlBtn = data.summary
                    ? `<button onclick="downloadSummary('${recordingId}')" style="float:right;background:#4338ca;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;">⬇️ Tải .md</button>`
                    : '';
                html += `<div class="section"><h3>📝 Biên bản AI tóm tắt ${dlBtn}</h3>`;
                if (data.summary) {
                    html += `<div class="summary-box">${escapeHtml(data.summary)}</div>`;
                } else {
                    html += `<div class="summary-box empty">Chưa có biên bản AI cho cuộc họp này.</div>`;
                }
                html += `</div>`;

                // Transcript theo người nói
                html += `<div class="section"><h3>🗣️ Nội dung theo người nói</h3>`;
                const finals = (data.transcripts || []).filter(t => t.is_final !== false);
                const toShow = finals.length > 0 ? finals : (data.transcripts || []);
                if (toShow.length > 0) {
                    html += toShow.map(t => `
                        <div class="line">
                            <span class="who" style="color:${speakerColor(t.speaker)}">${escapeHtml(speakerDisplay(t.speaker))}</span>
                            <span class="txt">${escapeHtml(t.text)}</span>
                            <span class="ts">${formatTimestamp(t.timestamp)}</span>
                        </div>
                    `).join('');
                } else {
                    html += `<div class="empty-state"><div class="empty-state-text">Chưa có nội dung</div></div>`;
                }
                html += `</div>`;

                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><div class="empty-state-text">Lỗi: ${e.message}</div></div>`;
            }
        }

        function downloadSummary(recordingId) {
            window.location.href = `/api/minutes/summary/${recordingId}/download`;
        }

        function closeDetail() { document.getElementById('detailModal').style.display = 'none'; }
        window.onclick = (ev) => { if (ev.target == document.getElementById('detailModal')) closeDetail(); };

        function formatDate(d) {
            if (!d || d.length !== 8) return d || '';
            return `${d.substring(6,8)}/${d.substring(4,6)}/${d.substring(0,4)}`;
        }
        function formatTime(t) {
            if (!t || t.length !== 6) return t || '';
            return `${t.substring(0,2)}:${t.substring(2,4)}:${t.substring(4,6)}`;
        }
        function formatTimestamp(ts) {
            if (!ts) return '';
            try { return new Date(ts).toLocaleString('vi-VN'); } catch { return ts; }
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
