[project]
name = "meeting-minutes"
version = "0.1.0"
description = "Meeting Minutes Bot - Ghi âm và dịch realtime cuộc họp"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,gladia,speechmatics,silero,local-smart-turn-v3,runner]",
    "google-genai>=1.0",
    "python-dotenv>=1.0.0",
    # Lưu trữ WAV /minutes lên Cloudflare R2 (S3-compatible). Chỉ dùng khi
    # MINUTES_STORAGE_BACKEND=r2; mặc định "local" không cần kết nối mạng.
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

