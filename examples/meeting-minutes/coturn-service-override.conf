# Coturn Systemd Service Override
# Location: /etc/systemd/system/coturn.service.d/override.conf
#
# To apply:
# sudo mkdir -p /etc/systemd/system/coturn.service.d/
# sudo cp coturn-service-override.conf /etc/systemd/system/coturn.service.d/override.conf
# sudo systemctl daemon-reload
# sudo systemctl restart coturn

[Service]
# Auto-restart on failure
Restart=always
RestartSec=10

# Restart if service exits with non-zero code
RestartPreventExitStatus=

# Start limit (prevent restart loop)
StartLimitInterval=300
StartLimitBurst=5

# Watchdog (optional - requires coturn support)
# WatchdogSec=30

# Resource limits
LimitNOFILE=65536
LimitNPROC=4096

# Logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=coturn

# Security (optional)
# PrivateTmp=yes
# NoNewPrivileges=yes
